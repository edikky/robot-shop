apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    service: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      service: shipping
  template:
    metadata:
      labels:
        service: shipping
    spec:
      {{- if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{- end }}
      containers:
        - name: shipping
          image: {{ .Values.image.repo }}/rs-shipping:{{ .Values.image.version }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080

          resources:
            {{- toYaml .Values.shipping.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: {{ .Values.shipping.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.shipping.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.shipping.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.shipping.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.shipping.readinessProbe.successThreshold }}

      restartPolicy: Always

      {{- with .Values.shipping.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.shipping.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.shipping.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}