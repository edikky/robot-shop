apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: robot-shop
  namespace: monitoring
  labels:
    release: monitoring
spec:
  jobName: robot-shop-probe
  interval: 15s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://web.robot-shop.svc:8080/
        - http://web.robot-shop.svc:8080/api/catalogue/products
        - http://web.robot-shop.svc:8080/api/catalogue/categories
        - http://web.robot-shop.svc:8080/api/cart/health
        - http://web.robot-shop.svc:8080/api/payment/health